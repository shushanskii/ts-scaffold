packages:
  - "packages/*"
  - "apps/*"

# Single source of truth for shared dependency versions across the workspace.
catalog:
  # Toolchain
  typescript: ^7.0.2

  # Frontend runtime
  react: ^19.0.0
  react-dom: ^19.0.0
  styled-components: ^6.1.13
  "@reduxjs/toolkit": ^2.12.0
  react-redux: ^9.3.0
  redux-saga: ^1.5.1

  # Backend runtime
  express: ^5.2.1

  # Types
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0
  "@types/express": ^5.0.6
  "@types/node": ^26.1.2
  "@types/supertest": ^7.2.1

  # Bundlers — tsc never emits, see conventions/core.md
  vite: ^8.2.0
  "@vitejs/plugin-react": ^6.0.5
  tsup: ^8.5.1

  # Test toolchain
  vitest: ^4.1.10
  jsdom: ^30.0.1
  "@testing-library/react": ^16.3.2
  "@testing-library/jest-dom": ^7.0.0
  jest-styled-components: ^7.4.0
  supertest: ^7.2.2

# Dependencies allowed to run install/build scripts (pnpm blocks them by default).
allowBuilds:
  '@biomejs/biome': true
  esbuild: true