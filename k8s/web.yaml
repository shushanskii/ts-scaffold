# The static bundle and the Caddy that serves it (Dockerfile.web, deploy/Caddyfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: ts-scaffold
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: ts-scaffold
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ts-scaffold
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ts-scaffold
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: git.rezolver-zero.com/developer/ts-scaffolding/web:g014a9fc8
          ports:
            - name: http
              containerPort: 8080
          # The probe asks for /, which is index.html: an HTTP response from the file server is the
          # readiness this container has — there is no dependency to wait for.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            # No allowPrivilegeEscalation here, and that is not an oversight: /usr/bin/caddy in the
            # official image carries the file capability cap_net_bind_service (`getcap` shows it), and
            # no_new_privs — which that flag turns on — makes execve of a file-capability binary fail.
            # The symptom is a container that never starts, `exec /usr/bin/caddy: operation not
            # permitted`, and nothing in the manifest looks wrong. Dropping capabilities is still
            # worth its line; binding below 1024 is not, since this server listens on 8080.
            capabilities:
              drop: ["ALL"]
            # Not runAsNonRoot either: the image is root, and uid 101 would need /data (Caddy's
            # storage) to arrive writable, which is an emptyDir with the right group and a decision of
            # its own. Static files do not need it today; it is still owed.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: ts-scaffold
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: ts-scaffold
spec:
  selector:
    app.kubernetes.io/name: ts-scaffold
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
