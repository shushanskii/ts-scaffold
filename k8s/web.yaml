# The static bundle and the Caddy that serves it (Dockerfile.web, deploy/Caddyfile).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app.kubernetes.io/name: ts-scaffold
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: ts-scaffold
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ts-scaffold
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ts-scaffold
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: git.rezolver-zero.com/developer/ts-scaffolding/web:g8b7b3caa
          ports:
            - name: http
              containerPort: 8080
          # The probe asks for /, which is index.html: an HTTP response from the file server is the
          # readiness this container has — there is no dependency to wait for.
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          securityContext:
            # All capabilities dropped, one kept, and the one kept is not about binding a port —
            # this server listens on 8080. /usr/bin/caddy in the official image carries the file
            # capability cap_net_bind_service (`getcap /usr/bin/caddy`), and a binary whose file
            # capabilities include something outside the process's bounding set is not executed at
            # all: execve answers EPERM and the pod says `exec /usr/bin/caddy: operation not
            # permitted` without ever reaching the config. So NET_BIND_SERVICE goes back into the
            # set, and everything else stays dropped.
            #
            # Reproduce without a cluster: docker run --rm --cap-drop ALL --entrypoint caddy <image>
            # version — add --cap-add NET_BIND_SERVICE and it prints a version.
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
            # No allowPrivilegeEscalation either: it sets no_new_privs, and the same file capability
            # that needs the bounding set is what no_new_privs refuses an exec of.
            #
            # Not runAsNonRoot either: the image is root, and uid 101 would need /data (Caddy's
            # storage) to arrive writable, which is an emptyDir with the right group and a decision of
            # its own. Static files do not need it today; it is still owed.
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 500m
              memory: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: web
  labels:
    app.kubernetes.io/name: ts-scaffold
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: ts-scaffold
spec:
  selector:
    app.kubernetes.io/name: ts-scaffold
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: http
