# One host, two backends: the browser asks the same origin for the bundle and for its data, and this
# file is where they part.
#
# No `tls:` section. The certificate is the gateway's problem — it terminates TLS for
# *.rezolver-zero.com and forwards plain HTTP to Traefik (srv01/router/caddy/Caddyfile), so a
# certificate here would be a second, unused one.
#
# No strip-prefix middleware either, and that is the point of the mount in apps/api: the service
# answers /api/todos, so the path that arrives is the path that is served, in the cluster and on a
# laptop's dev proxy alike.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ts-scaffold
  labels:
    app.kubernetes.io/name: ts-scaffold
    app.kubernetes.io/part-of: ts-scaffold
spec:
  ingressClassName: traefik
  rules:
    - host: ts-scaffold-app.rezolver-zero.com
      http:
        paths:
          # Traefik ranks routers by the length of the match, so this prefix beats the one below it
          # without an explicit priority; the order of the entries is not what decides it.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  name: http
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  name: http
