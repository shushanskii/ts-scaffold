# The Express service. Its image is built by CI from this repository (Dockerfile.api) and pushed to
# the registry the forge also serves.
#
# No imagePullSecret: the node authenticates to this registry itself, in
# /etc/rancher/k3s/registries.yaml, which is also what lets it pull the Argo CD images. A pull secret
# here would be a second credential for the same access, and the second one is the one that expires.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: ts-scaffold
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ts-scaffold
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ts-scaffold
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ts-scaffold
        app.kubernetes.io/component: api
    spec:
      containers:
        - name: api
          # The tag is the release. CI publishes g<short-sha> per commit and nothing else, so this
          # line is the whole deployment decision and a rollout is a one-line commit.
          image: git.rezolver-zero.com/developer/ts-scaffolding/api:gadbb33f1
          ports:
            - name: http
              containerPort: 3000
          # NODE_ENV and PORT are baked into the image; repeating them here would be a second place
          # to change and the first place to get wrong.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          securityContext:
            # The image ends with USER node; a name is not enough for Kubernetes to verify that, so
            # the uid is spelled out — without it the pod sits in CreateContainerConfigError with
            # "image has non-numeric user (node), cannot verify user is non-root".
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: "1"
              memory: 192Mi
          volumeMounts:
            # readOnlyRootFilesystem with a scratch /tmp: node writes nothing there today, and the
            # alternative is to loosen the root filesystem for the day something expects a tempdir.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: ts-scaffold
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: ts-scaffold
spec:
  selector:
    app.kubernetes.io/name: ts-scaffold
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
